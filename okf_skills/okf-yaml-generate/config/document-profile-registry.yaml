# OKF 文档 Profile 注册表。
#
# Profile 直接使用完整 okftype 作为唯一键。分类器从文档事实得到一个
# okftype，Profile 只声明公共字段之外允许生成的字段和输出契约。
# 不在这里维护路径规则、实体层级、字段能力依赖或 okftype 组合表。

schema_version: 4
status: active
registry_id: okf-document-profile-v3
taxonomy: ../okf-tag-generate/taxonomy/tag-taxonomy.json

common_required_fields: [okftype, title, resource, timestamp]
common_fields: [okftype, title, resource, description, tag, signature, archs, header,
                declaration, type_catalog, dependencies, examples, navigation, timestamp]

# YAML 字段顺序是输出契约，不能由 common/profile 字段拼接顺序间接决定。
field_order:
  [okftype, title, resource, description, tag, signature, archs, header, declaration,
   type_catalog, dependencies, examples, navigation, timestamp]

unknown_policy:
  unclassified_document: report_only
  generated_unknown_field: reject
  regeneration:
    target_classification: reclassify_from_source
    existing_front_matter: replace_all
    evidence: source_files_only

field_catalog:
  okftype:
    含义: 文档族、页面种类和技术词元组成的受控页面类型。
    事实来源: 文档结构分类结果和本次运行上下文。
  title:
    含义: 页面标题。
    事实来源: Markdown 一级标题。
  resource:
    含义: 仓内资源路径。
    事实来源: Markdown 相对路径。
  description:
    含义: 页面主体的简要说明。
    事实来源: 已验证的 description artifact。
  tag:
    含义: 用于检索的语义标签。
    事实来源: 每个 namespace:value 的逐字证据。
  timestamp:
    含义: 本次生成日期。
    事实来源: 运行元数据。
  signature:
    含义: 函数、函数宏或类成员的原型标识。
    事实来源: Markdown 原型与真实声明的兼容匹配结果。
  dependencies:
    含义: 当前页面引用的关联 API 或文档。
    事实来源: Markdown 链接和关联语句。
  examples:
    含义: 已确认的样例工程或调用位置。
    事实来源: 样例索引和实际调用。
  navigation:
    含义: 导航页直接链接的子页面及其标题。
    事实来源: Markdown 中的相对链接和链接文本。
  header:
    含义: 定义或声明所在的头文件。
    事实来源: 唯一的头文件匹配结果。
  archs:
    含义: 所有函数原型共同适用的架构列表。
    事实来源: 函数原型的架构证据。
  declaration:
    含义: 非函数实体的声明信息。
    事实来源: 头文件定义匹配结果。
  type_catalog:
    含义: 数据类型分类页的类型目录。
    事实来源: 文档目录和类型解析结果。

output_contracts:
  front_matter:
    写入位置: front_matter
    说明: 只写公共必填字段和 Profile 允许且有证据的字段。
  doxygen:
    写入位置: include_doxygen
    固定身份: ['@ingroup', '@override_id 或 @macro_id']
    有证据时生成: ['@archs', '@level', '@brief', '@param']
  example_markers:
    写入位置: example_markers
    固定格式: 成对 //! [override_id] marker

# fields 表示该 Profile 允许解析器生成的字段，不表示每个字段都必须出现。
# 公共字段由 common_required_fields 提供；Profile 字段不会继承 common_fields 中的全部可选字段。
profiles:
  reference.api.cpp:
    说明: C++ 或 AscendC 的单个可调用接口、类或成员接口。
    fields: [description, tag, signature, archs, header, dependencies, examples]
    outputs: [front_matter, doxygen, example_markers]

  reference.type.cpp:
    说明: C++ 或 AscendC 的类型、定义实体和宏定义页。
    fields: [description, tag, header]
    outputs: [front_matter, doxygen]

  reference.index.cpp:
    说明: C++ 或 AscendC API 的导航目录页。
    fields: [navigation]
    outputs: [front_matter]

  reference.concept.cpp:
    说明: C++ 或 AscendC API 的概述、约束、特性或机制说明。
    fields: [description, tag, dependencies]
    outputs: [front_matter]

  reference.catalog.cpp:
    说明: C++ 或 AscendC API 的汇总、能力矩阵和对照表。
    fields: [description, tag, dependencies]
    outputs: [front_matter]

  reference.release.cpp:
    说明: C++ 或 AscendC API 的版本发布和变更说明。
    fields: [description, tag, dependencies]
    outputs: [front_matter]

# OKF 文档 Profile 注册表（v5，slim 头）。
#
# 字段契约的唯一事实源是 ../references/头字段与标注规范.md（5 字段）。
# Profile 使用完整 okftype 作为唯一键；required 表示该 Profile 写入时必须出现的字段
#（dependencies 允许空数组）。

schema_version: 5
status: active
registry_id: okf-document-profile-v5
taxonomy: config/tag-taxonomy.json

common_required_fields: [okftype]
common_fields: [okftype, description, tag, dependencies, version]

# YAML 字段顺序是输出契约。
field_order: [okftype, description, tag, dependencies, version]

unknown_policy:
  unclassified_document: report_only
  generated_unknown_field: reject
  regeneration:
    target_classification: reclassify_from_source
    existing_front_matter: replace_all
    evidence: source_files_only

field_catalog:
  okftype:
    含义: 文档族、页面种类组成的受控页面类型。
    事实来源: 文档结构分类结果和本次运行上下文。
  description:
    含义: 页面语义的单段中文摘要（8–180 字）。
    事实来源: 已验证的语义标注 artifact。
  tag:
    含义: 语义标签，仅 roles/operations/traits 三个 namespace。
    事实来源: 每个 namespace:value 的逐字证据。
  dependencies:
    含义: 关联 API 或文档及关系类型；replaced_by 表示当前废弃实体指向替代目标。
    事实来源: Markdown 正文明确表达的关联语句。
  version:
    含义: 接口原型的 CANN 生命周期区间，如 9.0.0- 或 9.0.0-9.2.0。
    事实来源: Release Notes 逐版本清单（derive_version 脚本推导）。

output_contracts:
  front_matter:
    写入位置: front_matter
    说明: 只写 Profile 允许且必填的字段；可推导字段一律不写（见 references/头字段与标注规范.md 第 1 节）。

# fields: 该 Profile 允许写入的字段；required: 写入时必须出现的字段。
profiles:
  reference.api:
    说明: 可调用接口页（含架构变体页）。
    fields: [description, tag, dependencies, version]
    required: [description, tag, version, dependencies]
    outputs: [front_matter]

  reference.constant:
    说明: C API 常量定义页。
    fields: [description, tag, dependencies, version]
    required: [description, tag, version, dependencies]
    outputs: [front_matter]

  reference.enum:
    说明: C API 枚举和枚举别名定义页。
    fields: [description, tag, dependencies, version]
    required: [description, tag, version, dependencies]
    outputs: [front_matter]

  reference.macro:
    说明: 预处理器宏定义页。
    fields: [description, tag, dependencies, version]
    required: [description, tag, version, dependencies]
    outputs: [front_matter]

  reference.union:
    说明: C API 结构体和联合体定义页。
    fields: [description, tag, dependencies, version]
    required: [description, tag, version, dependencies]
    outputs: [front_matter]

  reference.type:
    说明: C API 数据类型目录页。
    fields: [description, tag, dependencies, version]
    required: [description, tag, version, dependencies]
    outputs: [front_matter]

  reference.index:
    说明: 导航目录页；navigation 由索引期从正文链接推导，不写入头。
    fields: []
    required: []
    outputs: [front_matter]

  reference.concept:
    说明: 概述、约束、特性或机制说明页。
    fields: [description]
    required: [description]
    outputs: [front_matter]

  reference.catalog:
    说明: 汇总、能力矩阵和对照表页。
    fields: [description]
    required: [description]
    outputs: [front_matter]

  reference.release:
    说明: 版本发布和变更说明页。
    fields: [description]
    required: [description]
    outputs: [front_matter]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Arial, sans-serif">
  <defs>
    <style>
      .axis-line { stroke: #333; stroke-width: 1.5; }
      .grid-line { stroke: #ddd; stroke-width: 0.8; stroke-dasharray: 3,3; }
      .tick-text { font-size: 11px; fill: #333; }
      .axis-title { font-size: 13px; fill: #333; font-weight: bold; }
      .data-label { font-size: 9px; fill: #333; }
      .line-data { stroke: #ED7D31; stroke-width: 2.5; fill: none; }
      .dot-data { fill: #ED7D31; }
    </style>
  </defs>
  <rect width="600" height="400" fill="#fff"/>

  <!-- Chart: x=80-550, y=50-340, Y=0-85us, 1us=3.588px -->
  <text x="315" y="25" text-anchor="middle" style="font-size:14px;font-weight:bold;fill:#333;">大shape(2097152) Task Duration 随核数变化</text>

  <!-- Y gridlines (every 10us) -->
  <line x1="80" y1="340" x2="550" y2="340" class="grid-line"/>
  <line x1="80" y1="304.1" x2="550" y2="304.1" class="grid-line"/>
  <line x1="80" y1="268.2" x2="550" y2="268.2" class="grid-line"/>
  <line x1="80" y1="232.4" x2="550" y2="232.4" class="grid-line"/>
  <line x1="80" y1="196.5" x2="550" y2="196.5" class="grid-line"/>
  <line x1="80" y1="160.6" x2="550" y2="160.6" class="grid-line"/>
  <line x1="80" y1="124.7" x2="550" y2="124.7" class="grid-line"/>
  <line x1="80" y1="88.8" x2="550" y2="88.8" class="grid-line"/>
  <line x1="80" y1="50" x2="550" y2="50" class="grid-line"/>

  <text x="70" y="344" text-anchor="end" class="tick-text">0</text>
  <text x="70" y="308" text-anchor="end" class="tick-text">10</text>
  <text x="70" y="272" text-anchor="end" class="tick-text">20</text>
  <text x="70" y="236" text-anchor="end" class="tick-text">30</text>
  <text x="70" y="200" text-anchor="end" class="tick-text">40</text>
  <text x="70" y="164" text-anchor="end" class="tick-text">50</text>
  <text x="70" y="128" text-anchor="end" class="tick-text">60</text>
  <text x="70" y="92" text-anchor="end" class="tick-text">70</text>
  <text x="70" y="54" text-anchor="end" class="tick-text">80</text>
  <text x="25" y="195" text-anchor="middle" class="axis-title" transform="rotate(-90 25 195)">Task Duration (us)</text>

  <line x1="80" y1="340" x2="550" y2="340" class="axis-line"/>
  <line x1="80" y1="50" x2="80" y2="340" class="axis-line"/>

  <!-- X: 1024→x=150, 128→x=315, 64→x=480 -->
  <text x="150" y="360" text-anchor="middle" class="tick-text">1024</text>
  <text x="315" y="360" text-anchor="middle" class="tick-text">128</text>
  <text x="480" y="360" text-anchor="middle" class="tick-text">64</text>
  <text x="315" y="380" text-anchor="middle" class="axis-title">Block Dim (逻辑核数)</text>

  <!-- Data: S9(1024,80.477)→y=340-80.477*3.588=50.1, S10(128,65.837)→y=102.3, S11(64,63.347)→y=111.2 -->
  <polyline points="150,50.1 315,102.3 480,111.2" class="line-data"/>
  <circle cx="150" cy="50.1" r="5" class="dot-data"/>
  <circle cx="315" cy="102.3" r="5" class="dot-data"/>
  <circle cx="480" cy="111.2" r="5" class="dot-data"/>
  <text x="150" y="43" text-anchor="middle" class="data-label">80.477</text>
  <text x="315" y="95" text-anchor="middle" class="data-label">65.837</text>
  <text x="480" y="104" text-anchor="middle" class="data-label" style="font-weight:bold;">63.347</text>
</svg>
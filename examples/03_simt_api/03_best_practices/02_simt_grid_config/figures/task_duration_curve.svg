<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Arial, sans-serif">
  <defs>
    <style>
      .axis-line { stroke: #333; stroke-width: 1.5; }
      .grid-line { stroke: #ddd; stroke-width: 0.8; stroke-dasharray: 3,3; }
      .tick-text { font-size: 11px; fill: #333; }
      .tick-text-sm { font-size: 9px; fill: #555; }
      .axis-title { font-size: 13px; fill: #333; font-weight: bold; }
      .chart-title { font-size: 15px; fill: #333; font-weight: bold; }
      .legend-text { font-size: 11px; fill: #333; }
      .data-label { font-size: 9px; fill: #333; }
      .group-label { font-size: 10px; fill: #4472C4; font-weight: bold; }
      .group-label-orange { font-size: 10px; fill: #ED7D31; font-weight: bold; }
      .line-dummy { stroke: #4472C4; stroke-width: 2.5; fill: none; }
      .line-compute { stroke: #ED7D31; stroke-width: 2.5; fill: none; }
      .dot-dummy { fill: #4472C4; }
      .dot-compute { fill: #ED7D31; }
      .anno-text { font-size: 10px; fill: #E74C3C; font-weight: bold; }
      .anno-line { stroke: #E74C3C; stroke-width: 1.2; stroke-dasharray: 4,2; }
      .group-box { stroke: #4472C4; stroke-width: 1; stroke-dasharray: 4,2; fill: none; opacity: 0.4; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- Chart area: x=80 to x=880, y=50 to y=400 -->
  <!-- Y axis: 0 to 60 us, 1us = 5.833px -->

  <text x="480" y="30" text-anchor="middle" class="chart-title">Task Duration vs Case Configuration</text>

  <!-- Y gridlines -->
  <line x1="80" y1="400" x2="880" y2="400" class="grid-line"/>
  <line x1="80" y1="341.67" x2="880" y2="341.67" class="grid-line"/>
  <line x1="80" y1="283.33" x2="880" y2="283.33" class="grid-line"/>
  <line x1="80" y1="225" x2="880" y2="225" class="grid-line"/>
  <line x1="80" y1="166.67" x2="880" y2="166.67" class="grid-line"/>
  <line x1="80" y1="108.33" x2="880" y2="108.33" class="grid-line"/>
  <line x1="80" y1="50" x2="880" y2="50" class="grid-line"/>

  <text x="70" y="404" text-anchor="end" class="tick-text">0</text>
  <text x="70" y="346" text-anchor="end" class="tick-text">10</text>
  <text x="70" y="287" text-anchor="end" class="tick-text">20</text>
  <text x="70" y="229" text-anchor="end" class="tick-text">30</text>
  <text x="70" y="171" text-anchor="end" class="tick-text">40</text>
  <text x="70" y="112" text-anchor="end" class="tick-text">50</text>
  <text x="70" y="54" text-anchor="end" class="tick-text">60</text>

  <text x="22" y="225" text-anchor="middle" class="axis-title" transform="rotate(-90 22 225)">Task Duration (us)</text>

  <line x1="80" y1="400" x2="880" y2="400" class="axis-line"/>
  <line x1="80" y1="50" x2="80" y2="400" class="axis-line"/>

  <!-- Separator -->
  <line x1="610" y1="50" x2="610" y2="400" stroke="#999" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="350" y="47" text-anchor="middle" class="group-label">空壳核函数 (empty_kernel)</text>
  <text x="760" y="47" text-anchor="middle" class="group-label-orange">实际计算 (gather_adds)</text>

  <!-- X labels: 场景 → vf信息 → 核数 → X轴标题 -->
  <text x="100" y="418" text-anchor="middle" class="tick-text">场景1</text>
  <text x="100" y="434" text-anchor="middle" class="tick-text-sm">(1vf)</text>
  <text x="180" y="418" text-anchor="middle" class="tick-text">场景5</text>
  <text x="180" y="434" text-anchor="middle" class="tick-text-sm">(2vf)</text>
  <text x="260" y="418" text-anchor="middle" class="tick-text">场景2</text>
  <text x="260" y="434" text-anchor="middle" class="tick-text-sm">(1vf)</text>
  <text x="340" y="418" text-anchor="middle" class="tick-text">场景7</text>
  <text x="340" y="434" text-anchor="middle" class="tick-text-sm">(14vf)</text>
  <text x="420" y="418" text-anchor="middle" class="tick-text">场景3</text>
  <text x="420" y="434" text-anchor="middle" class="tick-text-sm">(1vf)</text>
  <text x="500" y="418" text-anchor="middle" class="tick-text">场景4</text>
  <text x="500" y="434" text-anchor="middle" class="tick-text-sm">(1vf)</text>
  <text x="580" y="418" text-anchor="middle" class="tick-text">场景6</text>
  <text x="580" y="434" text-anchor="middle" class="tick-text-sm">(2vf)</text>
  <text x="660" y="418" text-anchor="middle" class="tick-text">场景8</text>
  <text x="660" y="434" text-anchor="middle" class="tick-text-sm">(1024核)</text>
  <text x="740" y="418" text-anchor="middle" class="tick-text">场景9</text>
  <text x="740" y="434" text-anchor="middle" class="tick-text-sm">(64核,vf外)</text>
  <text x="820" y="418" text-anchor="middle" class="tick-text">场景10</text>
  <text x="820" y="434" text-anchor="middle" class="tick-text-sm">(64核,vf内)</text>

  <!-- 核数分组 -->
  <text x="140" y="450" text-anchor="middle" class="group-label">36核</text>
  <text x="300" y="450" text-anchor="middle" class="group-label">64核</text>
  <text x="420" y="450" text-anchor="middle" class="group-label">128核</text>
  <text x="540" y="450" text-anchor="middle" class="group-label">1024核</text>

  <text x="480" y="472" text-anchor="middle" class="axis-title">Case Configuration</text>

  <!-- Group boxes -->
  <rect x="90" y="370" width="100" height="35" rx="3" class="group-box"/>
  <rect x="250" y="354" width="100" height="50" rx="3" class="group-box"/>
  <rect x="490" y="315" width="100" height="90" rx="3" class="group-box"/>

  <!-- empty_kernel polyline -->
  <polyline points="100,374.8 180,374.1 260,373.8 340,369.4 420,368.4 500,322.3 580,319.7" class="line-dummy"/>

  <circle cx="100" cy="374.8" r="4.5" class="dot-dummy"/>
  <circle cx="180" cy="374.1" r="4.5" class="dot-dummy"/>
  <circle cx="260" cy="373.8" r="4.5" class="dot-dummy"/>
  <circle cx="340" cy="369.4" r="4.5" class="dot-dummy"/>
  <circle cx="420" cy="368.4" r="4.5" class="dot-dummy"/>
  <circle cx="500" cy="322.3" r="4.5" class="dot-dummy"/>
  <circle cx="580" cy="319.7" r="4.5" class="dot-dummy"/>

  <text x="100" y="365" text-anchor="middle" class="data-label">4.329</text>
  <text x="180" y="364" text-anchor="middle" class="data-label">4.434</text>
  <text x="260" y="364" text-anchor="middle" class="data-label">4.484</text>
  <text x="340" y="360" text-anchor="middle" class="data-label">5.243</text>
  <text x="420" y="359" text-anchor="middle" class="data-label">5.412</text>
  <text x="500" y="313" text-anchor="middle" class="data-label">13.349</text>
  <text x="580" y="310" text-anchor="middle" class="data-label">13.794</text>

  <!-- vf annotations -->
  <text x="140" y="385" text-anchor="middle" class="data-label" fill="#4472C4">+2%</text>
  <text x="300" y="383" text-anchor="middle" class="data-label" fill="#4472C4">+16%</text>
  <text x="540" y="329" text-anchor="middle" class="data-label" fill="#4472C4">+3%</text>

  <!-- gather_adds polyline -->
  <polyline points="660,68.3 740,309.1 820,311.5" class="line-compute"/>

  <circle cx="660" cy="68.3" r="5.5" class="dot-compute"/>
  <circle cx="740" cy="309.1" r="5.5" class="dot-compute"/>
  <circle cx="820" cy="311.5" r="5.5" class="dot-compute"/>

  <text x="660" y="59" text-anchor="middle" class="data-label">56.868</text>
  <text x="740" y="300" text-anchor="middle" class="data-label">15.608</text>
  <text x="820" y="303" text-anchor="middle" class="data-label">15.197</text>

  <line x1="660" y1="68.3" x2="740" y2="309.1" class="anno-line"/>
  <text x="700" y="175" text-anchor="middle" class="anno-text">-72.5%</text>

  <line x1="740" y1="309.1" x2="820" y2="311.5" class="anno-line"/>
  <text x="778" y="324" text-anchor="middle" class="anno-text">-2.6%</text>

  <!-- Legend -->
  <line x1="100" y1="505" x2="130" y1="505" class="line-dummy"/>
  <circle cx="115" cy="505" r="4" class="dot-dummy"/>
  <text x="138" y="509" class="legend-text">empty_kernel (空壳核函数)</text>

  <line x1="320" y1="505" x2="350" y2="505" class="line-compute"/>
  <circle cx="335" cy="505" r="4" class="dot-compute"/>
  <text x="358" y="509" class="legend-text">gather_adds (实际计算)</text>
</svg>
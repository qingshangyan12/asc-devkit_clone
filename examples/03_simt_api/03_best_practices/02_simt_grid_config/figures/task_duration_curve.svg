<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600" font-family="Arial, sans-serif">
  <defs>
    <style>
      .axis-line { stroke: #333; stroke-width: 1.5; }
      .grid-line { stroke: #ddd; stroke-width: 0.8; stroke-dasharray: 3,3; }
      .tick-text { font-size: 11px; fill: #333; }
      .tick-text-sm { font-size: 8px; fill: #555; }
      .axis-title { font-size: 13px; fill: #333; font-weight: bold; }
      .chart-title { font-size: 16px; fill: #333; font-weight: bold; }
      .legend-text { font-size: 10px; fill: #333; }
      .data-label { font-size: 8px; fill: #333; }
      .tbd-label { font-size: 7px; fill: #999; }
      .line-empty { stroke: #4472C4; stroke-width: 2; fill: none; }
      .line-large { stroke: #ED7D31; stroke-width: 2; fill: none; }
      .line-medium { stroke: #C0392B; stroke-width: 2; fill: none; }
      .line-small { stroke: #70AD47; stroke-width: 2; fill: none; }
      .dot-empty { fill: #4472C4; }
      .dot-large { fill: #ED7D31; }
      .dot-medium { fill: #C0392B; }
      .dot-small { fill: #70AD47; }
      .dot-tbd { fill: none; stroke: #999; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="600" fill="#ffffff"/>

  <!-- Chart area: x=80 to x=1440, y=60 to y=450, Y=0-100us, 1us=3.9px -->

  <text x="760" y="35" text-anchor="middle" class="chart-title">Task Duration vs SCENARIO_NUM (23 Scenarios)</text>

  <!-- Section headers -->
  <text x="310" y="52" text-anchor="middle" style="font-size:11px;fill:#4472C4;font-weight:bold;">Case 0/1: 空壳核函数</text>
  <text x="620" y="52" text-anchor="middle" style="font-size:11px;fill:#ED7D31;font-weight:bold;">Case 2: 大shape</text>
  <text x="810" y="52" text-anchor="middle" style="font-size:11px;fill:#C0392B;font-weight:bold;">Case 3: 中shape</text>
  <text x="1160" y="52" text-anchor="middle" style="font-size:11px;fill:#70AD47;font-weight:bold;">Case 4: 小shape</text>

  <!-- Y gridlines -->
  <line x1="80" y1="450" x2="1440" y2="450" class="grid-line"/>
  <line x1="80" y1="411" x2="1440" y2="411" class="grid-line"/>
  <line x1="80" y1="372" x2="1440" y2="372" class="grid-line"/>
  <line x1="80" y1="333" x2="1440" y2="333" class="grid-line"/>
  <line x1="80" y1="294" x2="1440" y2="294" class="grid-line"/>
  <line x1="80" y1="255" x2="1440" y2="255" class="grid-line"/>
  <line x1="80" y1="216" x2="1440" y2="216" class="grid-line"/>
  <line x1="80" y1="177" x2="1440" y2="177" class="grid-line"/>
  <line x1="80" y1="138" x2="1440" y2="138" class="grid-line"/>
  <line x1="80" y1="99" x2="1440" y2="99" class="grid-line"/>
  <line x1="80" y1="60" x2="1440" y2="60" class="grid-line"/>

  <!-- Y tick labels -->
  <text x="70" y="454" text-anchor="end" class="tick-text">0</text>
  <text x="70" y="415" text-anchor="end" class="tick-text">10</text>
  <text x="70" y="376" text-anchor="end" class="tick-text">20</text>
  <text x="70" y="337" text-anchor="end" class="tick-text">30</text>
  <text x="70" y="298" text-anchor="end" class="tick-text">40</text>
  <text x="70" y="259" text-anchor="end" class="tick-text">50</text>
  <text x="70" y="220" text-anchor="end" class="tick-text">60</text>
  <text x="70" y="181" text-anchor="end" class="tick-text">70</text>
  <text x="70" y="142" text-anchor="end" class="tick-text">80</text>
  <text x="70" y="103" text-anchor="end" class="tick-text">90</text>
  <text x="70" y="64" text-anchor="end" class="tick-text">100</text>

  <text x="22" y="255" text-anchor="middle" class="axis-title" transform="rotate(-90 22 255)">Task Duration (us)</text>

  <!-- Axes -->
  <line x1="80" y1="450" x2="1440" y2="450" class="axis-line"/>
  <line x1="80" y1="60" x2="80" y2="450" class="axis-line"/>

  <!-- Separators -->
  <line x1="540" y1="60" x2="540" y2="450" stroke="#999" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="720" y1="60" x2="720" y2="450" stroke="#999" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="930" y1="60" x2="930" y2="450" stroke="#999" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- X positions (spacing=60px):
    Case 0/1: S1=100 S2=160 S3=220 S4=280 S5=340 S6=400 S7=460 S8=520
    Case 2:   S9=560 S10=620 S11=680
    Case 3:   S12=750 S13=810 S14=870 S15=930
    Case 4:   S16=990 S17=1050 S18=1110 S19=1170 S20=1230 S21=1290 S22=1350 S23=1410
  -->

  <!-- X labels: Case 0/1 -->
  <text x="100" y="468" text-anchor="middle" class="tick-text-sm">1</text>
  <text x="160" y="468" text-anchor="middle" class="tick-text-sm">2</text>
  <text x="220" y="468" text-anchor="middle" class="tick-text-sm">3</text>
  <text x="280" y="468" text-anchor="middle" class="tick-text-sm">4</text>
  <text x="340" y="468" text-anchor="middle" class="tick-text-sm">5</text>
  <text x="400" y="468" text-anchor="middle" class="tick-text-sm">6</text>
  <text x="460" y="468" text-anchor="middle" class="tick-text-sm">7</text>
  <text x="520" y="468" text-anchor="middle" class="tick-text-sm">8</text>
  <text x="100" y="480" text-anchor="middle" class="tick-text-sm" style="fill:#4472C4;">1核</text>
  <text x="160" y="480" text-anchor="middle" class="tick-text-sm" style="fill:#4472C4;">32核</text>
  <text x="220" y="480" text-anchor="middle" class="tick-text-sm" style="fill:#4472C4;">64核</text>
  <text x="280" y="480" text-anchor="middle" class="tick-text-sm" style="fill:#4472C4;">128核</text>
  <text x="340" y="480" text-anchor="middle" class="tick-text-sm" style="fill:#4472C4;">1024核</text>
  <text x="400" y="480" text-anchor="middle" class="tick-text-sm" style="fill:#4472C4;">32核2vf</text>
  <text x="460" y="480" text-anchor="middle" class="tick-text-sm" style="fill:#4472C4;">64核2vf</text>
  <text x="520" y="480" text-anchor="middle" class="tick-text-sm" style="fill:#4472C4;">1024核2vf</text>

  <!-- X labels: Case 2 -->
  <text x="560" y="468" text-anchor="middle" class="tick-text-sm">9</text>
  <text x="620" y="468" text-anchor="middle" class="tick-text-sm">10</text>
  <text x="680" y="468" text-anchor="middle" class="tick-text-sm">11</text>
  <text x="560" y="480" text-anchor="middle" class="tick-text-sm" style="fill:#ED7D31;">1024核</text>
  <text x="620" y="480" text-anchor="middle" class="tick-text-sm" style="fill:#ED7D31;">128核</text>
  <text x="680" y="480" text-anchor="middle" class="tick-text-sm" style="fill:#ED7D31;">64核</text>


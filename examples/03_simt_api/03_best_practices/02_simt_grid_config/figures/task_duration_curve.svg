  <text x="1050" y="468" text-anchor="middle" class="tick-text-sm">17</text>
  <text x="1110" y="468" text-anchor="middle" class="tick-text-sm">18</text>
  <text x="1170" y="468" text-anchor="middle" class="tick-text-sm">19</text>
  <text x="1230" y="468" text-anchor="middle" class="tick-text-sm">20</text>
  <text x="1290" y="468" text-anchor="middle" class="tick-text-sm">21</text>
  <text x="1350" y="468" text-anchor="middle" class="tick-text-sm">22</text>
  <text x="1410" y="468" text-anchor="middle" class="tick-text-sm">23</text>
  <text x="990" y="480" text-anchor="middle" class="tick-text-sm" style="fill:#70AD47;">4核</text>
  <text x="1050" y="480" text-anchor="middle" class="tick-text-sm" style="fill:#70AD47;">8核</text>

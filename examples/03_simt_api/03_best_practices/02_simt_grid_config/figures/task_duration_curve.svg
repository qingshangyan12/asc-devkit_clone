  <text x="930" y="468" text-anchor="middle" class="tick-text-sm">15</text>
  <text x="750" y="480" text-anchor="middle" class="tick-text-sm" style="fill:#C0392B;">16核</text>
  <text x="810" y="480" text-anchor="middle" class="tick-text-sm" style="fill:#C0392B;">32核</text>

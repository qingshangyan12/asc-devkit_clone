  <text x="1170" y="480" text-anchor="middle" class="tick-text-sm" style="fill:#70AD47;">32核</text>
  <text x="1230" y="480" text-anchor="middle" class="tick-text-sm" style="fill:#70AD47;">64核</text>
  <text x="1290" y="480" text-anchor="middle" class="tick-text-sm" style="fill:#70AD47;">16核1kT</text>
  <text x="1350" y="480" text-anchor="middle" class="tick-text-sm" style="fill:#70AD47;">32核512T</text>
  <text x="1410" y="480" text-anchor="middle" class="tick-text-sm" style="fill:#70AD47;">64核256T</text>

  <text x="760" y="498" text-anchor="middle" class="axis-title">SCENARIO_NUM</text>

  <!-- Case 0/1: known data (S3, S4, S5, S8) -->
  <!-- S3:4.57→y=432.2 S4:5.05→y=430.3 S5:14.244→y=394.5 S8:16.2→y=386.8 -->
  <polyline points="220,432.2 280,430.3 340,394.5" class="line-empty"/>
  <circle cx="220" cy="432.2" r="3.5" class="dot-empty"/>
  <circle cx="280" cy="430.3" r="3.5" class="dot-empty"/>
  <circle cx="340" cy="394.5" r="3.5" class="dot-empty"/>
  <text x="220" y="424" text-anchor="middle" class="data-label">4.57</text>
  <text x="280" y="422" text-anchor="middle" class="data-label">5.05</text>
  <text x="340" y="386" text-anchor="middle" class="data-label">14.244</text>

  <!-- Case 0: TBD (S1, S2) -->
  <circle cx="100" cy="440" r="3" class="dot-tbd"/>
  <circle cx="160" cy="440" r="3" class="dot-tbd"/>
  <text x="100" y="435" text-anchor="middle" class="tbd-label">TBD</text>
  <text x="160" y="435" text-anchor="middle" class="tbd-label">TBD</text>

  <!-- Case 1: known data (S8) -->
  <circle cx="520" cy="386.8" r="3.5" class="dot-empty"/>
  <text x="520" y="378" text-anchor="middle" class="data-label">16.2</text>

  <!-- Case 1: TBD (S6, S7) -->
  <circle cx="400" cy="440" r="3" class="dot-tbd"/>
  <circle cx="460" cy="440" r="3" class="dot-tbd"/>
  <text x="400" y="435" text-anchor="middle" class="tbd-label">TBD</text>
  <text x="460" y="435" text-anchor="middle" class="tbd-label">TBD</text>

  <!-- Case 2: known data line (S9→S11) -->
  <!-- S9:81.004→y=134.1 S10:TBD S11:63.731→y=201.5 -->
  <polyline points="560,134.1 680,201.5" class="line-large"/>
  <circle cx="560" cy="134.1" r="4" class="dot-large"/>
  <circle cx="680" cy="201.5" r="4" class="dot-large"/>
  <text x="560" y="125" text-anchor="middle" class="data-label">81.004</text>
  <text x="680" y="193" text-anchor="middle" class="data-label">63.731</text>

  <!-- Case 2: TBD (S10) -->
  <circle cx="620" cy="440" r="3" class="dot-tbd"/>
  <text x="620" y="435" text-anchor="middle" class="tbd-label">TBD</text>

  <!-- Case 3: known data line (S12→S14) -->
  <!-- S12:81.596→y=133.8 S13:53.324→y=242 S14:41.346→y=288.8 -->
  <polyline points="750,133.8 810,242 870,288.8" class="line-medium"/>
  <circle cx="750" cy="133.8" r="4" class="dot-medium"/>
  <circle cx="810" cy="242" r="4" class="dot-medium"/>
  <circle cx="870" cy="288.8" r="4" class="dot-medium"/>
  <text x="750" y="125" text-anchor="middle" class="data-label">81.596</text>
  <text x="810" y="233" text-anchor="middle" class="data-label">53.324</text>
  <text x="870" y="280" text-anchor="middle" class="data-label">41.346</text>

  <!-- Case 3: TBD (S15) -->
  <circle cx="930" cy="440" r="3" class="dot-tbd"/>
  <text x="930" y="435" text-anchor="middle" class="tbd-label">TBD</text>

  <!-- Case 4: all TBD (S16-S23) -->
  <circle cx="990" cy="440" r="3" class="dot-tbd"/>
  <circle cx="1050" cy="440" r="3" class="dot-tbd"/>
  <circle cx="1110" cy="440" r="3" class="dot-tbd"/>
  <circle cx="1170" cy="440" r="3" class="dot-tbd"/>
  <circle cx="1230" cy="440" r="3" class="dot-tbd"/>
  <circle cx="1290" cy="440" r="3" class="dot-tbd"/>
  <circle cx="1350" cy="440" r="3" class="dot-tbd"/>
  <circle cx="1410" cy="440" r="3" class="dot-tbd"/>
  <text x="990" y="435" text-anchor="middle" class="tbd-label">TBD</text>
  <text x="1050" y="435" text-anchor="middle" class="tbd-label">TBD</text>
  <text x="1110" y="435" text-anchor="middle" class="tbd-label">TBD</text>
  <text x="1170" y="435" text-anchor="middle" class="tbd-label">TBD</text>
  <text x="1230" y="435" text-anchor="middle" class="tbd-label">TBD</text>
  <text x="1290" y="435" text-anchor="middle" class="tbd-label">TBD</text>
  <text x="1350" y="435" text-anchor="middle" class="tbd-label">TBD</text>
  <text x="1410" y="435" text-anchor="middle" class="tbd-label">TBD</text>

  <!-- Legend -->
  <line x1="180" y1="560" x2="210" y2="560" class="line-empty"/>
  <circle cx="195" cy="560" r="3.5" class="dot-empty"/>
  <text x="218" y="564" class="legend-text">Case 0/1: empty_kernel</text>

  <line x1="400" y1="560" x2="430" y2="560" class="line-large"/>
  <circle cx="415" cy="560" r="3.5" class="dot-large"/>
  <text x="438" y="564" class="legend-text">Case 2: gather+adds (大)</text>

  <line x1="600" y1="560" x2="630" y2="560" class="line-medium"/>
  <circle cx="615" cy="560" r="3.5" class="dot-medium"/>
  <text x="638" y="564" class="legend-text">Case 3: gather+adds (中)</text>

  <line x1="800" y1="560" x2="830" y2="560" class="line-small"/>
  <circle cx="815" cy="560" r="3.5" class="dot-small"/>
  <text x="838" y="564" class="legend-text">Case 4: gather+adds (小)</text>

  <circle cx="1040" cy="560" r="3" class="dot-tbd"/>
  <text x="1050" y="564" class="legend-text">TBD (数据待补充)</text>
</svg>
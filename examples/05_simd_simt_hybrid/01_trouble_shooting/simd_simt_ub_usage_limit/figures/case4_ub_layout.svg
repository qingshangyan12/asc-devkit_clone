<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650">
  <style>
    text { font-family: Arial, "Noto Sans CJK SC", sans-serif; fill: #1f2937; }
    .title { font-size: 25px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #4b5563; }
    .address { font-size: 14px; font-weight: 700; text-anchor: end; }
    .region { font-size: 17px; font-weight: 700; }
    .range { font-size: 14px; fill: #4b5563; }
    .probe { font-size: 14px; font-weight: 700; }
    .note { font-size: 14px; fill: #4b5563; }
  </style>
  <rect width="1120" height="650" fill="#ffffff"/>
  <text x="50" y="45" class="title">Case 4：小静态 UB 越界进入不同区域</text>
  <text x="50" y="72" class="subtitle">4KB static_ub，动态 UB 为 0；所有访问偏移均从 static_ub 首地址开始计算</text>

  <text x="155" y="116" class="address">0KB</text>
  <text x="155" y="174" class="address">4KB</text>
  <text x="155" y="328" class="address">120KB</text>
  <text x="155" y="398" class="address">126KB</text>
  <text x="155" y="468" class="address">128KB</text>
  <text x="155" y="582" class="address">256KB</text>

  <rect x="180" y="105" width="390" height="60" fill="#dff3e4" stroke="#247a44" stroke-width="2"/>
  <text x="205" y="132" class="region">静态 UB：4KB</text>
  <text x="205" y="153" class="range">合法范围 [0KB, 4KB)</text>

  <rect x="180" y="165" width="390" height="155" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="205" y="229" class="region">未申请的普通 UB：116KB</text>
  <text x="205" y="252" class="range">[4KB, 120KB)</text>

  <rect x="180" y="320" width="390" height="70" fill="#fff1c7" stroke="#b7791f" stroke-width="2"/>
  <text x="205" y="349" class="region">VF 栈预留：6KB</text>
  <text x="205" y="372" class="range">[120KB, 126KB)</text>

  <rect x="180" y="390" width="390" height="70" fill="#ffe0b8" stroke="#c15c16" stroke-width="2"/>
  <text x="205" y="419" class="region">Ascend C API 预留：2KB</text>
  <text x="205" y="442" class="range">[126KB, 128KB)</text>

  <rect x="180" y="460" width="390" height="115" fill="#fbd5d5" stroke="#b42318" stroke-width="2"/>
  <text x="205" y="507" class="region">SIMT Data Cache：128KB</text>
  <text x="205" y="530" class="range">[128KB, 256KB)</text>

  <line x1="570" y1="160" x2="625" y2="160" stroke="#247a44" stroke-width="2"/>
  <circle cx="570" cy="160" r="5" fill="#247a44"/>
  <text x="642" y="154" class="probe">region 0 · 4092B</text>
  <text x="642" y="175" class="note">数组最后一个 word，合法访问，精度通过</text>

  <line x1="570" y1="244" x2="625" y2="244" stroke="#6b7280" stroke-width="2"/>
  <circle cx="570" cy="244" r="5" fill="#6b7280"/>
  <text x="642" y="238" class="probe">region 1 · 63488B</text>
  <text x="642" y="259" class="note">已越界；本次运行无可见异常</text>

  <line x1="570" y1="355" x2="625" y2="355" stroke="#b7791f" stroke-width="2"/>
  <circle cx="570" cy="355" r="5" fill="#b7791f"/>
  <text x="642" y="349" class="probe">region 2 · 125952B</text>
  <text x="642" y="370" class="note">已越界；本次 VF 未使用中转栈</text>

  <line x1="570" y1="425" x2="625" y2="425" stroke="#c15c16" stroke-width="2"/>
  <circle cx="570" cy="425" r="5" fill="#c15c16"/>
  <text x="642" y="419" class="probe">region 3 · 130048B</text>
  <text x="642" y="440" class="note">已越界；本 Case 未调用依赖该区域的 API</text>

  <line x1="570" y1="466" x2="625" y2="466" stroke="#b42318" stroke-width="3"/>
  <circle cx="570" cy="466" r="6" fill="#b42318"/>
  <text x="642" y="482" class="probe">region 4 · 131072B</text>
  <text x="642" y="503" class="note">已越界并写入 Data Cache 起点</text>
  <rect x="635" y="520" width="395" height="50" rx="4" fill="#fff0f0" stroke="#b42318"/>
  <text x="653" y="550" class="probe" fill="#b42318">kernel 正常结束，但输出出现 1 个精度错误</text>

  <rect x="50" y="606" width="1020" height="30" fill="#f8fafc"/>
  <text x="65" y="627" class="note">结论：只有 region 0 位于 static_ub 声明范围内；region 1～4 即使未报错，也都是非法越界访问。</text>
</svg>

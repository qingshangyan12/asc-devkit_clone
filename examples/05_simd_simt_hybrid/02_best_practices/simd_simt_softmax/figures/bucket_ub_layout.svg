<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Case 2 编译期bucket：分桶、UB布局与寄存器驻留示意</text>

  <text x="40" y="66" font-size="14" font-weight="bold" fill="#1a1a1a">1. bucket分桶与UB布局（以cols=197、kBucketCols=256为例）</text>
  <text x="40" y="90" font-size="13" fill="#333333">GM中的一行（真实cols个有效元素）</text>
  <g fill="#DBEAFE" stroke="#3B82F6" stroke-width="1">
    <rect x="40" y="98" width="32" height="22"/>
    <rect x="76" y="98" width="32" height="22"/>
    <rect x="112" y="98" width="32" height="22"/>
    <rect x="148" y="98" width="32" height="22"/>
    <rect x="184" y="98" width="32" height="22"/>
    <rect x="220" y="98" width="32" height="22"/>
    <rect x="256" y="98" width="32" height="22"/>
    <rect x="292" y="98" width="32" height="22"/>
    <rect x="328" y="98" width="32" height="22"/>
    <rect x="364" y="98" width="32" height="22"/>
    <rect x="400" y="98" width="32" height="22"/>
    <rect x="436" y="98" width="32" height="22"/>
  </g>
  <line x1="254" y1="124" x2="254" y2="156" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="146" font-size="13" fill="#334155">MTE2按真实cols搬入，尾部不搬运</text>

  <text x="40" y="178" font-size="13" fill="#333333">UB中的一行（按bucket宽度对齐）</text>
  <g fill="#DBEAFE" stroke="#3B82F6" stroke-width="1">
    <rect x="40" y="186" width="32" height="22"/>
    <rect x="76" y="186" width="32" height="22"/>
    <rect x="112" y="186" width="32" height="22"/>
    <rect x="148" y="186" width="32" height="22"/>
    <rect x="184" y="186" width="32" height="22"/>
    <rect x="220" y="186" width="32" height="22"/>
    <rect x="256" y="186" width="32" height="22"/>
    <rect x="292" y="186" width="32" height="22"/>
    <rect x="328" y="186" width="32" height="22"/>
    <rect x="364" y="186" width="32" height="22"/>
    <rect x="400" y="186" width="32" height="22"/>
    <rect x="436" y="186" width="32" height="22"/>
  </g>
  <g fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4,3">
    <rect x="472" y="186" width="32" height="22"/>
    <rect x="508" y="186" width="32" height="22"/>
    <rect x="544" y="186" width="32" height="22"/>
    <rect x="580" y="186" width="32" height="22"/>
    <rect x="616" y="186" width="32" height="22"/>
    <rect x="652" y="186" width="32" height="22"/>
  </g>
  <text x="694" y="202" font-size="12" fill="#6B7280">尾部padding（空置）</text>
  <line x1="40" y1="220" x2="684" y2="220" stroke="#334155" stroke-width="1"/>
  <line x1="40" y1="214" x2="40" y2="220" stroke="#334155" stroke-width="1"/>
  <line x1="684" y1="214" x2="684" y2="220" stroke="#334155" stroke-width="1"/>
  <text x="362" y="240" text-anchor="middle" font-size="13" fill="#334155">kBucketCols = 64 / 128 / 256 / 384 / 512（编译期常量）</text>

  <text x="40" y="276" font-size="14" font-weight="bold" fill="#1a1a1a">2. 一个Warp处理一行，中间值驻留寄存器</text>
  <text x="40" y="298" font-size="13" fill="#333333">一个Warp的32个线程协作处理一行，每线程按32列步进取数：</text>

  <text x="40" y="318" font-size="13" font-family="monospace" fill="#334155">thread 0</text>
  <g fill="#DCFCE7" stroke="#22C55E" stroke-width="1">
    <rect x="130" y="306" width="16" height="16"/>
    <rect x="152" y="306" width="16" height="16"/>
    <rect x="174" y="306" width="16" height="16"/>
    <rect x="196" y="306" width="16" height="16"/>
    <rect x="218" y="306" width="16" height="16"/>
    <rect x="240" y="306" width="16" height="16"/>
    <rect x="262" y="306" width="16" height="16"/>
    <rect x="284" y="306" width="16" height="16"/>
  </g>
  <text x="40" y="354" font-size="13" font-family="monospace" fill="#334155">thread 1</text>
  <g fill="#DCFCE7" stroke="#22C55E" stroke-width="1">
    <rect x="130" y="342" width="16" height="16"/>
    <rect x="152" y="342" width="16" height="16"/>
    <rect x="174" y="342" width="16" height="16"/>
    <rect x="196" y="342" width="16" height="16"/>
    <rect x="218" y="342" width="16" height="16"/>
    <rect x="240" y="342" width="16" height="16"/>
    <rect x="262" y="342" width="16" height="16"/>
    <rect x="284" y="342" width="16" height="16"/>
  </g>
  <text x="98" y="376" font-size="14" fill="#6B7280">⋮</text>
  <text x="40" y="398" font-size="13" font-family="monospace" fill="#334155">thread 31</text>
  <g fill="#DCFCE7" stroke="#22C55E" stroke-width="1">
    <rect x="130" y="386" width="16" height="16"/>
    <rect x="152" y="386" width="16" height="16"/>
    <rect x="174" y="386" width="16" height="16"/>
    <rect x="196" y="386" width="16" height="16"/>
    <rect x="218" y="386" width="16" height="16"/>
    <rect x="240" y="386" width="16" height="16"/>
    <rect x="262" y="386" width="16" height="16"/>
    <rect x="284" y="386" width="16" height="16"/>
  </g>

  <rect x="420" y="302" width="424" height="106" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="440" y="328" font-size="13" fill="#334155">每线程持有静态数组 elements[kWarpIterations]，</text>
  <text x="440" y="350" font-size="13" fill="#334155">kWarpIterations = kBucketCols / 32（编译期定值）。</text>
  <text x="440" y="372" font-size="13" fill="#334155">整行元素一次读入后驻留寄存器，</text>
  <text x="440" y="394" font-size="13" fill="#334155">max / exp / sum / 归一化全部在寄存器中完成。</text>
</svg>

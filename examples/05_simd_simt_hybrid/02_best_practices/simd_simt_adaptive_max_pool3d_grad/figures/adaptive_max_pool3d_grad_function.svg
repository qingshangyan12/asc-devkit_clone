<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
  <title id="title">AdaptiveMaxPool3DGrad gradient scatter diagram</title>
  <desc id="desc">The diagram shows that grad values are scattered back to gradInput positions recorded by argmax, while other gradInput positions remain zero.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#3867d6"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#182033" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f6f8fb; }
      .panel { fill: #ffffff; stroke: #d6dde8; stroke-width: 1.2; filter: url(#softShadow); }
      .panel-title { fill: #1f2937; font: 700 20px Arial, sans-serif; }
      .label { fill: #334155; font: 600 15px Arial, sans-serif; }
      .small { fill: #64748b; font: 13px Arial, sans-serif; }
      .cell { fill: #eef2f7; stroke: #cbd5e1; stroke-width: 1; }
      .zero { fill: #f8fafc; stroke: #d6dde8; stroke-width: 1; }
      .hit-a { fill: #f59e0b; stroke: #b45309; stroke-width: 1.4; }
      .hit-b { fill: #22c55e; stroke: #15803d; stroke-width: 1.4; }
      .hit-c { fill: #38bdf8; stroke: #0284c7; stroke-width: 1.4; }
      .hit-d { fill: #f472b6; stroke: #be185d; stroke-width: 1.4; }
      .cell-text { fill: #0f172a; font: 700 14px Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
      .muted-text { fill: #94a3b8; font: 700 14px Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
      .arrow { stroke: #3867d6; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow-note { fill: #2451b2; font: 600 13px Arial, sans-serif; text-anchor: middle; }
      .window { fill: none; stroke: #3867d6; stroke-width: 2; stroke-dasharray: 6 5; }
      .formula { fill: #111827; font: 700 16px Arial, sans-serif; dominant-baseline: middle; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="440" rx="10"/>

  <rect class="panel" x="34" y="34" width="250" height="356" rx="8"/>
  <text class="panel-title" x="58" y="72">输出梯度 grad</text>
  <text class="small" x="58" y="98">每个输出位置保存一个梯度值</text>

  <g transform="translate(72 136)">
    <rect class="hit-a" x="0" y="0" width="58" height="58" rx="5"/>
    <rect class="hit-b" x="70" y="0" width="58" height="58" rx="5"/>
    <rect class="hit-c" x="0" y="70" width="58" height="58" rx="5"/>
    <rect class="hit-d" x="70" y="70" width="58" height="58" rx="5"/>
    <text class="cell-text" x="29" y="29">g0</text>
    <text class="cell-text" x="99" y="29">g1</text>
    <text class="cell-text" x="29" y="99">g2</text>
    <text class="cell-text" x="99" y="99">g3</text>
  </g>

  <rect class="panel" x="335" y="34" width="250" height="356" rx="8"/>
  <text class="panel-title" x="359" y="72">argmax</text>
  <text class="small" x="359" y="98">记录前向最大值在输入窗口内的位置</text>

  <g transform="translate(372 132)">
    <rect class="cell" x="0" y="0" width="58" height="48" rx="5"/>
    <rect class="cell" x="70" y="0" width="58" height="48" rx="5"/>
    <rect class="cell" x="0" y="60" width="58" height="48" rx="5"/>
    <rect class="cell" x="70" y="60" width="58" height="48" rx="5"/>
    <text class="cell-text" x="29" y="24">5</text>
    <text class="cell-text" x="99" y="24">6</text>
    <text class="cell-text" x="29" y="84">13</text>
    <text class="cell-text" x="99" y="84">15</text>
  </g>

  <text class="formula" x="460" y="416">gradInput[argmax[i]] = grad[i]，其余位置置为 0</text>

  <rect class="panel" x="638" y="34" width="248" height="356" rx="8"/>
  <text class="panel-title" x="662" y="72">计算结果 gradInput</text>
  <text class="small" x="662" y="98">先清零，再按 argmax 离散回填</text>

  <g transform="translate(676 140)">
    <rect class="zero" x="0" y="0" width="42" height="42" rx="4"/>
    <rect class="zero" x="48" y="0" width="42" height="42" rx="4"/>
    <rect class="zero" x="96" y="0" width="42" height="42" rx="4"/>
    <rect class="zero" x="144" y="0" width="42" height="42" rx="4"/>
    <rect class="zero" x="0" y="48" width="42" height="42" rx="4"/>
    <rect class="hit-a" x="48" y="48" width="42" height="42" rx="4"/>
    <rect class="hit-b" x="96" y="48" width="42" height="42" rx="4"/>
    <rect class="zero" x="144" y="48" width="42" height="42" rx="4"/>
    <rect class="zero" x="0" y="96" width="42" height="42" rx="4"/>
    <rect class="zero" x="48" y="96" width="42" height="42" rx="4"/>
    <rect class="zero" x="96" y="96" width="42" height="42" rx="4"/>
    <rect class="zero" x="144" y="96" width="42" height="42" rx="4"/>
    <rect class="zero" x="0" y="144" width="42" height="42" rx="4"/>
    <rect class="hit-c" x="48" y="144" width="42" height="42" rx="4"/>
    <rect class="zero" x="96" y="144" width="42" height="42" rx="4"/>
    <rect class="hit-d" x="144" y="144" width="42" height="42" rx="4"/>
    <text class="muted-text" x="21" y="21">0</text>
    <text class="muted-text" x="69" y="21">0</text>
    <text class="muted-text" x="117" y="21">0</text>
    <text class="muted-text" x="165" y="21">0</text>
    <text class="muted-text" x="21" y="69">0</text>
    <text class="cell-text" x="69" y="69">g0</text>
    <text class="cell-text" x="117" y="69">g1</text>
    <text class="muted-text" x="165" y="69">0</text>
    <text class="muted-text" x="21" y="117">0</text>
    <text class="muted-text" x="69" y="117">0</text>
    <text class="muted-text" x="117" y="117">0</text>
    <text class="muted-text" x="165" y="117">0</text>
    <text class="muted-text" x="21" y="165">0</text>
    <text class="cell-text" x="69" y="165">g2</text>
    <text class="muted-text" x="117" y="165">0</text>
    <text class="cell-text" x="165" y="165">g3</text>
    <rect class="window" x="-6" y="-6" width="102" height="102" rx="7"/>
    <rect class="window" x="90" y="-6" width="102" height="102" rx="7"/>
    <rect class="window" x="-6" y="90" width="102" height="102" rx="7"/>
    <rect class="window" x="90" y="90" width="102" height="102" rx="7"/>
  </g>

  <path class="arrow" d="M286 174 C312 174, 314 174, 334 174"/>
  <path class="arrow" d="M586 174 C615 174, 616 174, 637 174"/>
  <path class="arrow" d="M586 266 C615 266, 616 266, 637 266"/>
  <text class="arrow-note" x="310" y="157">读取</text>
  <text class="arrow-note" x="612" y="157">Scatter</text>
  <text class="arrow-note" x="612" y="249">回填</text>
</svg>

minimum_pre_commit_version: 4.0.0
exclude: ^LICENSES/|\.(html|csv|svg)$

default_stages: [pre-commit]
ci:
  autofix_prs: false
  autoupdate_schedule: monthly

repos:
  # C++ 代码格式化检查
  - repo: https://gitcode.com/pre-commit-clang/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: \.(c|h|cpp|hpp|cc|hh|cxx|hxx|asc)$
        exclude: ^(tests/python/aclrt_launch_kernel/stub_files/|impl/|include/|tools/)
        args:
          - "--style=file"
          - "--verbose"
          - "-i"

  # OAT 合规性检查 (Open Source Audit Tool)
  - repo: local
    hooks:
      - id: oat-check
        name: OAT Compliance Check
        entry: bash scripts/oat_check.sh
        language: system
        pass_filenames: true
        types: [file]
        stages: [pre-commit]
        verbose: true

  # Markdown 链接有效性检查
  - repo: https://gitcode.com/gh_mirrors/lych/lychee.git
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        alias: markdown-link-check
        name: Markdown link check
        files: ^(docs|examples)/.*\.(md|markdown|mdx)$
        exclude: ^docs/guide/编程指南/附录/基于样例工程完成Kernel直调\.md$
        args: ["--no-progress", "--config", "markdown-link-check.toml"]
        stages: [pre-commit, manual]

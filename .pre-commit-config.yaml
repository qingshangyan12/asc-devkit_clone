minimum_pre_commit_version: 4.0.0
exclude: ^LICENSES/|\.(html|csv|svg|tsv)$

default_stages: [pre-commit]
ci:
  autofix_prs: false
  autoupdate_schedule: monthly

repos:
  # pre-commit 基础检查
  - repo: https://gitcode.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: \.md$
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json
        exclude: ^\.devcontainer/devcontainer\.json$

  # C++ 代码格式化检查
  - repo: https://gitcode.com/pre-commit-clang/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [file]
        files: \.(c|h|cpp|hpp|cc|hh|cxx|hxx|asc)$
        exclude: ^(tests/python/aclrt_launch_kernel/stub_files/|include/utils/)
        args:
          - "--style=file"
          - "--verbose"
          - "-i"

  # Python 代码检查
  - repo: https://gitcode.com/gh_mirrors/ru/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args:
          - "--output-format"
          - "github"
          - "--fix"
          - "--extend-ignore"
          - "E402,E711,E712,E721,F401,F403,F405,F811,F821,F841,F523,E741,F601"
        types: [python]
      - id: ruff-format
        types: [python]

  # 拼写检查
  - repo: https://gitcode.com/gh_mirrors/co/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [
            "-L",
            # Original in-repo vocabulary, plus identifiers/vocabulary the dictionary
            # flags that are not misspellings, plus PRE-EXISTING misspellings found in
            # host/kernel sources once the gate was widened (transitional debt; to be
            # cleaned up in a dedicated pass, see issue #1906).
            "CANN,cann,NNAL,nnal,ASCEND,ascend,EnQue,CopyIn,ArchType,AND,ND,tbe,copyin,alog,Collet,Enque,Normale,OUTTER,OffsetT,REGIST,Te,ThirdParty,VOR,abl,ans,catched,commiter,devlop,dout,enque,ges,nIn,nd,outter,padd,parm,subtile,te,ALLREADY,BU,CLOS,Clos,Comand,Curent,Exepected,Geneate,Genrate,Genrator,Hellow,IndexT,Informations,Invlid,NIn,Paser,Postion,Preapre,Splited,Unsupport,Wee,abd,achived,ailgn,aixs,algin,amongs,ane,archVer,arrary,atLeast,avaliable,begining,biasin,bufffer,caculate,caculated,caculation,calcalate,calculting,calcultion,chaging,chanel,clos,commond,comparision,compitable,conditon,configed,continious,continously,contrains,contrl,controll,corrent,correspoding,countIn,currect,decending,depened,diffrent,doesnot,donot,elments,enble,evnet,excute,exepected,experssion,exponet,exsit,exsited,externel,faield,fromat,frome,funtion,guarentee,halfs,hanle,indexIn,indexs,infomation,informations,inout,inouts,instroduced,interfacce,interger,invaild,isnt,ist,iterM,itslef,lenth,memery,muti,neet,nodel,noramlize,occured,opertor,opton,orderIn,ot,outpus,paramete,paramter,plaform,policys,posIn,positionIn,postion,precsion,properites,protocal,regist,registe,registed,registery,regstry,repeatIn,requries,reserv,reslove,reuseable,sacalar,scences,schem,seciton,senario,sence,seperate,seperately,ser,shoud,shoule,singe,siplified,splited,sucess,suport,suppoort,supporte,tagRet,templat,thi,thrid,tpye,uesd,unknow,unsupport,varialbe,varibale,vaule,verision,vor,wehn,wiht,wil,worspace",
            "--skip",
            # third-party and generated artifacts only; source code IS scanned
            "*third_party*,*third-party*,build*,*.svg,*.pkl,*.bin,pnpm-lock.yaml",
          ]
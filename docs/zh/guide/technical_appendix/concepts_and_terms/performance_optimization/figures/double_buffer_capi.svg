<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" role="img" aria-labelledby="title desc">
  <title id="title">Ping Pong DoubleBuffer的三个时间点</title>
  <desc id="desc">t0搬入块0到Ping；t1搬入块1到Pong并计算块0；t2搬入块2到Ping、计算块1并搬出块0。</desc>
  <rect width="1240" height="500" fill="#ffffff"/>
  <text x="620" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Ping/Pong DoubleBuffer的三个时间点</text>
  <text x="320" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">t0：预热</text>
  <text x="680" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">t1：开始重叠</text>
  <text x="1040" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">t2：三阶段重叠</text>
  <line x1="150" y1="105" x2="1210" y2="105" stroke="#64748b" stroke-width="1"/>
  <line x1="150" y1="210" x2="1210" y2="210" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="150" y1="315" x2="1210" y2="315" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="150" y1="420" x2="1210" y2="420" stroke="#64748b" stroke-width="1"/>
  <line x1="500" y1="105" x2="500" y2="420" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="860" y1="105" x2="860" y2="420" stroke="#cbd5e1" stroke-width="1"/>
  <text x="125" y="165" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f766e">MTE2搬入</text>
  <text x="125" y="270" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#4338ca">Vector计算</text>
  <text x="125" y="375" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b45309">MTE3搬出</text>
  <rect x="185" y="128" width="270" height="58" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="320" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#134e4a">块0输入 -&gt; Ping x/y</text>
  <text x="320" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#64748b">无</text>
  <text x="320" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#64748b">无</text>
  <rect x="545" y="128" width="270" height="58" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="680" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#134e4a">块1输入 -&gt; Pong x/y</text>
  <rect x="545" y="233" width="270" height="58" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="680" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#312e81">计算块0（Ping）</text>
  <text x="680" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#64748b">无</text>
  <rect x="905" y="128" width="270" height="58" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="1040" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#134e4a">块2输入 -&gt; Ping x/y</text>
  <rect x="905" y="233" width="270" height="58" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="1040" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#312e81">计算块1（Pong）</text>
  <rect x="905" y="338" width="270" height="58" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="1040" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#78350f">块0结果 &lt;- Ping z</text>
  <text x="620" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">t2中Ping的x/y与z是独立子缓冲区，搬入块2与搬出块0可以同时进行。</text>
</svg>

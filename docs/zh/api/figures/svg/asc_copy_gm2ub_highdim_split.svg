<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img" aria-labelledby="title desc">
  <title id="title">高维切分搬运示意图</title>
  <desc id="desc">高维切分搬运示意图。</desc>
  <style>
    .title { font: 20px '方正兰亭黑_GBK', 'FZLanTingHeiS', 'Huawei Sans', 'Microsoft YaHei', Arial, sans-serif; fill: #000000; }
    .label { font: 16px '方正兰亭黑_GBK', 'FZLanTingHeiS', 'Huawei Sans', 'Microsoft YaHei', Arial, sans-serif; fill: #000000; }
    .small { font: 14px '方正兰亭黑_GBK', 'FZLanTingHeiS', 'Huawei Sans', 'Microsoft YaHei', Arial, sans-serif; fill: #000000; }
    .src { fill: #C2D5FE; stroke: #686D75; stroke-width: 0.75; }
    .dst { fill: #9FE6D8; stroke: #686D75; stroke-width: 0.75; }
    .gap { fill: #FFFFFF; stroke: #686D75; stroke-width: 0.75; }
    .line { stroke: #686D75; stroke-width: 0.75; fill: none; }
    .stride { stroke: #686D75; stroke-width: 0.9; fill: none; }
    .arrow { stroke: #191919; stroke-width: 8; fill: none; }
    .middle { text-anchor: middle; dominant-baseline: middle; }
  </style>
  <rect width="840" height="410" fill="#FFFFFF"/>
  <text x="40" y="35" class="title">高维切分搬运示意图</text>
  <text x="20" y="107" class="label">src (GM)</text>
  <rect x="90" y="82" width="210" height="50" class="src"/>
  <rect x="300" y="82" width="70" height="50" class="gap"/>
  <rect x="370" y="82" width="210" height="50" class="src"/>
  <text x="195" y="107" class="label middle">Data 96B</text>
  <text x="335" y="107" class="small middle">Gap 32B</text>
  <text x="475" y="107" class="label middle">Data 96B</text>
  <text x="90" y="160" class="small">0B</text>
  <text x="370" y="160" class="small">128B</text>
  <line x1="90" y1="182" x2="370" y2="182" class="stride"/>
  <line x1="90" y1="176" x2="90" y2="188" class="line"/>
  <line x1="370" y1="176" x2="370" y2="188" class="line"/>
  <text x="180" y="206" class="small">src_stride = 128B</text>
  <line x1="390" y1="222" x2="390" y2="236" class="arrow"/>
  <polygon points="390,258 378,236 402,236" fill="#191919"/>
  <text x="20" y="289" class="label">dst (UB)</text>
  <rect x="90" y="264" width="210" height="50" class="dst"/>
  <rect x="300" y="264" width="140" height="50" class="gap"/>
  <rect x="440" y="264" width="210" height="50" class="dst"/>
  <text x="195" y="289" class="label middle">Data 96B</text>
  <text x="370" y="289" class="label middle">Gap 64B</text>
  <text x="545" y="289" class="label middle">Data 96B</text>
  <text x="90" y="342" class="small">0B</text>
  <text x="440" y="342" class="small">160B</text>
  <line x1="90" y1="364" x2="440" y2="364" class="stride"/>
  <line x1="90" y1="358" x2="90" y2="370" class="line"/>
  <line x1="440" y1="358" x2="440" y2="370" class="line"/>

<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img" aria-labelledby="title desc">
  <title id="title">连续搬运示意图</title>
  <desc id="desc">连续搬运示意图。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#686D75"/>
    </marker>
  </defs>
  <style>
    .title { font: 20px 'FZLanTingHeiS', 'Huawei Sans', 'Microsoft YaHei', Arial, sans-serif; fill: #000000; }
    .label { font: 16px 'FZLanTingHeiS', 'Huawei Sans', 'Microsoft YaHei', Arial, sans-serif; fill: #000000; }
    .small { font: 14px 'FZLanTingHeiS', 'Huawei Sans', 'Microsoft YaHei', Arial, sans-serif; fill: #000000; }
    .src { fill: #C2D5FE; stroke: #686D75; stroke-width: 0.75; }
    .dst { fill: #C2D5FE; stroke: #686D75; stroke-width: 0.75; }
    .line { stroke: #686D75; stroke-width: 0.75; fill: none; }
    .arrow { stroke: #686D75; stroke-width: 8; fill: none; }

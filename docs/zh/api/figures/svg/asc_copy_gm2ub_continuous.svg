  </style>
  <rect width="840" height="250" fill="#FFFFFF"/>
  <text x="40" y="35" class="title">连续搬运示意图</text>
  <text x="20" y="109" class="label">src (GM)</text>
  <path d="M 90 75 L 90 65 L 690 65 L 690 75" class="line"/>
  <text x="354" y="57" class="small">size = 256B</text>
  <rect x="90" y="85" width="600" height="50" class="src"/>
  <text x="390" y="110" class="label middle">Data 256B</text>
  <line x1="390" y1="145" x2="390" y2="156" class="arrow"/>
  <polygon points="390,178 378,156 402,156" fill="#686D75"/>
  <text x="20" y="214" class="label">dst (UB)</text>
  <rect x="90" y="190" width="600" height="50" class="dst"/>
  <text x="390" y="215" class="label middle">Data 256B</text>

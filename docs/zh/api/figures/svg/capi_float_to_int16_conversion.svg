    .line { stroke: #686D75; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .frame { fill: none; stroke: #172B4D; stroke-width: 1; }
  </style>
  <rect width="842" height="434" fill="#FFFFFF"/>


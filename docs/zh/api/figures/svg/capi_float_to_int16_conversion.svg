  <text x="680" y="36" class="label" text-anchor="middle">...</text>
  <text x="738" y="37" class="label">64个float元素</text>

  <text x="100" y="103" class="label" text-anchor="middle">asc_loadalign</text>
  <text x="100" y="123" class="label" text-anchor="middle">(x_reg, x_addr)</text>

<svg xmlns="http://www.w3.org/2000/svg" width="842" height="434" viewBox="0 0 842 434" role="img" aria-labelledby="title desc">
  <title id="title">float转int16_t类型转换过程</title>
  <desc id="desc">使用CAPI将float数据转换为int16_t数据的过程。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#686D75"/>
    </marker>
  </defs>
  <style>

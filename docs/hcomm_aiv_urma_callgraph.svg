<text x="470" y="374" font-family="Consolas, 'Source Code Pro', monospace" font-size="12" fill="#1e293b" text-anchor="middle" >   (读取SQ头指针)</text>
<text x="470" y="407" font-family="Consolas, 'Source Code Pro', monospace" font-size="12" fill="#1e293b" text-anchor="middle" >3. PollCqWhenSqOverflow</text>
<text x="470" y="440" font-family="Consolas, 'Source Code Pro', monospace" font-size="12" fill="#1e293b" text-anchor="middle" >   (SQ满时自动排水)</text>
<text x="470" y="473" font-family="Consolas, 'Source Code Pro', monospace" font-size="12" fill="#1e293b" text-anchor="middle" >4. HcommUrmaFillSqeCtx</text>
<text x="470" y="506" font-family="Consolas, 'Source Code Pro', monospace" font-size="12" fill="#1e293b" text-anchor="middle" >   (填充SQE结构)</text>
<text x="470" y="539" font-family="Consolas, 'Source Code Pro', monospace" font-size="12" fill="#1e293b" text-anchor="middle" >5. HcommUrmaFillSgeCtx</text>
<text x="470" y="572" font-family="Consolas, 'Source Code Pro', monospace" font-size="12" fill="#1e293b" text-anchor="middle" >   (填充SGE结构)</text>
<text x="470" y="605" font-family="Consolas, 'Source Code Pro', monospace" font-size="12" fill="#1e293b" text-anchor="middle" >6. DataCopy(UB→SQ)</text>
<text x="470" y="638" font-family="Consolas, 'Source Code Pro', monospace" font-size="12" fill="#1e293b" text-anchor="middle" >   (WQE拷贝到SQ)</text>
<text x="470" y="671" font-family="Consolas, 'Source Code Pro', monospace" font-size="12" fill="#1e293b" text-anchor="middle" >7. 更新sqPI, Ub2Gm</text>
<text x="470" y="704" font-family="Consolas, 'Source Code Pro', monospace" font-size="12" fill="#1e293b" text-anchor="middle" >   (sqPI回写GM)</text>
<text x="470" y="737" font-family="Consolas, 'Source Code Pro', monospace" font-size="12" fill="#1e293b" text-anchor="middle" >8. if(commit) → Commit</text>

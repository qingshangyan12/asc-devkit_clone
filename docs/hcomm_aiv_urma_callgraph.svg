<text x="470" y="275" font-family="Consolas, 'Source Code Pro', monospace" font-size="12" fill="#1e293b" text-anchor="middle" >1. HcommFindBufferIdx</text>
<text x="470" y="308" font-family="Consolas, 'Source Code Pro', monospace" font-size="12" fill="#1e293b" text-anchor="middle" >   (查找远端buffer索引)</text>

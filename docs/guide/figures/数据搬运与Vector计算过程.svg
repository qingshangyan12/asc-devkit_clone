<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 280" width="750" height="280">
  <!-- 背景 -->
  <rect width="750" height="280" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="375" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">数据搬运与Vector计算过程</text>
  
  <!-- Global Memory框 -->
  <rect x="30" y="50" width="120" height="80" rx="5" fill="#ffebee" stroke="#d32f2f" stroke-width="2"/>
  <text x="90" y="85" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#d32f2f">Global</text>
  <text x="90" y="105" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#d32f2f">Memory</text>
  
  <!-- Unified Buffer框 -->
  <rect x="300" y="50" width="150" height="80" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="375" y="75" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1976d2">Unified Buffer</text>
  <text x="375" y="95" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">(LocalMemory)</text>
  <text x="375" y="115" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#888">输入/输出数据</text>
  
  <!-- Vector计算单元框 -->
  <rect x="570" y="50" width="140" height="80" rx="5" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="640" y="75" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#f57c00">Vector</text>
  <text x="640" y="95" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#f57c00">计算单元</text>
  <text x="640" y="115" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#888">寄存器计算</text>
  
  <!-- CopyIn箭头 -->
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4caf50"/>
    </marker>
  </defs>
  <line x1="150" y1="90" x2="290" y2="90" stroke="#4caf50" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="220" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#4caf50">CopyIn</text>
  <text x="220" y="40" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#888">(MTE2搬运)</text>
  
  <!-- Load箭头 -->
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2196f3"/>
    </marker>
  </defs>
  <line x1="450" y1="90" x2="560" y2="90" stroke="#2196f3" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="505" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2196f3">Load</text>
  <text x="505" y="40" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#888">(UB→寄存器)</text>
  
  <!-- Compute箭头（Vector内部循环） -->
  <path d="M 640 130 Q 640 160 610 160 Q 580 160 580 130" stroke="#f57c00" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/>
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#f57c00"/>
    </marker>
  </defs>
  <text x="610" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#f57c00">Compute</text>
  
  <!-- Store箭头 -->
  <line x1="570" y1="200" x2="450" y2="200" stroke="#9c27b0" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <defs>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9c27b0"/>
    </marker>
  </defs>
  <text x="505" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#9c27b0">Store</text>
  <text x="505" y="235" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#888">(寄存器→UB)</text>
  
  <!-- CopyOut箭头 -->
  <line x1="300" y1="200" x2="150" y2="200" stroke="#d32f2f" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d32f2f"/>
    </marker>
  </defs>
  <text x="220" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#d32f2f">CopyOut</text>
  <text x="220" y="235" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#888">(MTE3搬运)</text>
  
  <!-- 流程说明框 -->
  <rect x="30" y="250" width="690" height="25" rx="3" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="375" y="267" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">完整流程：GM → CopyIn → UB → Load → 寄存器 → Compute → Store → UB → CopyOut → GM</text>
</svg>
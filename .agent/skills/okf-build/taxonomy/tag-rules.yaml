schema_version: 2
# 必填与证据规则。字段与标注边界的唯一事实源是 ../references/头字段与标注规范.md。
namespaces: [roles, operations, traits]
required_namespaces:
  always:
    - roles
  conditional:
    operations:
      when_roles_in:
        - compute
        - data_movement
        - data_initialization
evidence:
  every_selected_value_requires_evidence: true
  evidence_must_match_source: true
derivation_boundary:
  rule: 不得为可推导事实建标签；可推导维度见下方 derivable_dimensions 清单
  derivable_dimensions:
    - api_surfaces（文档路径）
    - execution_model（include 目录 + 原型 mangling 形态）
    - source/destination_locations（mangling 地址空间码 G/U/L1/FB/CA/CB/CC/v/vb）
    - dtype/archs/header/signature（include Doxygen + 声明）
    - masked（mangling _vb 后缀）
    - deprecated（ASC_DEPRECATED + 文档声明）
    - examples（//! [override_id] marker）
    - navigation（正文链接）
    - version（Release Notes + ASC_DEPRECATED）

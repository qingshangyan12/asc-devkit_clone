name: llt_action

on:
  workflow_call:
    inputs:
      ut_type:
        required: true
        type: string
      ut_package:
        type: string
        default: 'ut_cov_*.tar.gz'
      image_version:
        required: true
        type: string

jobs:
  JOB_ut:
    name: ut
    steps:
      -
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha || atomgit.sha }}
          token: ${{secrets.GIT_TOKEN}}
      -
        name: download
        uses: obs-download
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          key: |
            ${{ env.obs_path }}/pr_filelist.txt
            ${{ env.obs_path }}/pr_filelist_mod.txt
          path: ${{ steps.process_checkout.outputs.path }}
      -
        name: ut
        identifier: ut
        run: |
          if [[ "${{ inputs.ut_type }}" == UT_Test_arm ]]; then
              echo "host_type=arm64" >> $ATOMGIT_OUTPUT
          else
              echo "host_type=x86" >> $ATOMGIT_OUTPUT
          fi
          set -x
          cd ${{ steps.process_checkout.outputs.path }}
          echo $(grep -E "^VERSION_ID=" /etc/os-release | cut -d'"' -f2)
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          gcc --version
          source /home/jenkins/Ascend/cann/bin/setenv.bash
          set +e
          if [ "$TARGET_BRANCH" = "master" ] || [ "$TARGET_BRANCH" == "9.1.0-beta.2" ]; then
              bash build.sh --${{ inputs.ut_type }} --cov --cann_3rd_lib_path="/home/jenkins/opensource" -f "pr_filelist.txt"
          elif [ "$TARGET_BRANCH" = "exp/kadc" ]; then
              echo "not need run ut"
              exit 0
          elif [ "$TARGET_BRANCH" = "feature/tensor_api_from_9.0.0" ]; then
            if [ "${{ inputs.ut_type }}" = "UT_Test_basic_test_three" ] || [ "${{ inputs.ut_type }}" == "UT_Test_basic_test_two" ] || [ "${{ inputs.ut_type }}" == "UT_Test_basic_test_one" ]; then
              bash build.sh --${{ inputs.ut_type }} --cann_3rd_lib_path="/home/jenkins/opensource"
            else
              echo "not need run ut"
              exit 0
            fi
          else
            if [ "${{ inputs.ut_type }}" = "UT_Test_basic_test_three" ] || [ "${{ inputs.ut_type }}" == "UT_Test_basic_test_two" ] || [ "${{ inputs.ut_type }}" == "UT_Test_basic_test_one" ] || [ "${{ inputs.ut_type }}" == "UT_Test_adv_test*" ]; then
              bash build.sh --${{ inputs.ut_type }} --cov --cann_3rd_lib_path="/home/jenkins/opensource"
            else
              echo "not need run ut"
              exit 0
            fi
          fi

          if [ $ret -ne 200 ] && [ $ret -ne 0 ]; then
              echo "run ut fail"
              exit 1
          fi
          if [ $ret -eq 0 ]; then
              if [ "$coverage_save" = "true" ];then
                echo "ut_process=coverage" >> $ATOMGIT_OUTPUT
              else
                echo "ut_process=ut_cov" >> $ATOMGIT_OUTPUT
              fi
          fi
          exit 0
      -
        name: ut_cov
        identifier: ut_cov
        uses: cann/.gitcode/actions/ut-cov-report@master
        with:
          ut_process: ${{ steps.ut.outputs.ut_process }}
          workspace: ${{ steps.process_checkout.outputs.path }}
          ut_type: ${{ inputs.ut_type }}
          target_branch: ${{ env.TARGET_BRANCH }}
          git_token: ${{secrets.GIT_TOKEN}}
      -
        name: upload
        uses: obs-upload
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          access-key: ${{secrets.AK}}
          secret-key: ${{secrets.SK}}
          artifact-path: |
            ${{ steps.process_checkout.outputs.path }}/${{ inputs.ut_package }}
          object-prefix: ${{ env.obs_path }}/
    if: "${{ default() }}"
    runs-on: [dedicate-hosted, '${{ jobs.ut.outputs.host_type }}', xlarge]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ inputs.image_version }}
    # if: ${{ inputs.type != 'UT_Test_arm' }}
    # runs-on: [dedicate-hosted, x64, xlarge]
    # container:
    #   image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ inputs.image_version }}
    # if: ${{ inputs.type }}

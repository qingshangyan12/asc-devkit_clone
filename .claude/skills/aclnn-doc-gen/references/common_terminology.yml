## 规范用语要求

生成文档时必须严格使用规范用语，以下是完整的规范用语对照表：

### 错别字类（必须替换）
* "帐户" → "账户"
* "帐号" → "账号"
* "登陆" → "登录"
* "点击" → "单击"
* "数据报" → "数据包"
* "外型" → "外形"
* "图象" → "图像"
* "抽像" → "抽象"
* "级连" → "级联"
* "超连接" → "超链接"
* "直链" → "直连"
* "当机" → "系统崩溃"
* "宕机" → "系统崩溃"
* "瘫机" → "系统瘫痪"
* "标准网线" → "直通网线"
* "短信" → "短消息"
* "互联网" → "因特网"
* "互连网" → "因特网"
* "放止" → "防止"
* "阀值" → "阈值"
* "飞浆" → "飞桨"
* "鹏程" → "鹏城"

### 拼写错误类（必须替换）
* "acsend" → "ascend"
* "futrue" → "future"
* "structrue" → "structure"
* "ture" → "true"
* "donwload" → "download"
* "dispacther" → "dispatcher"
* "Particiapnt" → "Participant"
* "reqeust" → "request"
* "filed" → "field"
* "pumpload" → "pmupload"
* "retrun" → "return"


### 昇腾敏感词（必须删除或替换）
* "HBM" → "片上内存"或"On-Chip Memory"
* "算力密度" → 删除或替换
* "算力切分" → "昇腾虚拟化实例"
* "芯片面积"、"晶体管数量" → 删除或替换
* "NAND"、"128层"、"192层" → 删除或替换
* "芯片工艺"、"14nm"、"16nm"、"12nm"、"10nm"、"7nm"、"5nm" → 删除或替换
* "DDR5"、"LP DDR5"、"ddr5"、"lp ddr5" → 删除或替换
* "开源" → "开放"或"源码"

### 内部芯片代号（必须删除或替换）
* "1910"、"1980"、"1911"、"1971"、"1981"、"1982" → 删除或替换
* "1951"、"1952"、"1951 lite"、"1951lite" → 删除或替换
* "PG1"、"PG2" → 删除或替换
* "910B" → "Atlas A2系列训练产品"
* "910C" → "Atlas A3系列训练产品"或"超节点"或"超节点系列"
* "310P" → "Atlas 推理系列产品"

### 已下线产品（必须删除）
* "Atlas 300T A2" → 删除

### MDC敏感词（必须替换）
* "致命" → "关键"
* "缺陷" → "问题"
* "自动驾驶"、"自驾" → "辅助驾驶"
* "静默升级"、"强制升级" → "升级"
* "Fatal" → "Critical"
* "Defect" → "Issue"
* "Autonomous Driving" → "Intelligent driving"
* "Silent Upgrade"、"Force Upgrade" → "Upgrade"

### 重要说明
* 对于"删除或替换"的词汇，请根据上下文自行决定是删除还是用通用描述替换
* 对于"删除"的词汇，必须直接去掉，不要使用
* 其他情况必须严格替换为规范用语
